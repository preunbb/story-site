<?xml version="1.0" encoding="UTF-8"?>
<!--
  Church of the Broken Tree — flat emblem for pendants / print.
  Hand-copy recipe: sketch a naked tree as a shallow V (branches); from the notch,
  drop TWO jagged zigzag lines downward as twin trunk halves — a visible gap/lightning-shaped
  void splits the trunk mid-tree.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 88" aria-label="Church of the Broken Tree emblem">
  <!-- canopy: open Y / bare branches -->
  <path fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        d="M32 12 L21 38 M32 12 L43 38"/>
  <path fill="none" stroke="#161616" stroke-width="2" stroke-linecap="round"
        d="M32 20 L27 37 M32 20 L37 37"/>
  <!-- broken trunk halves (zigzag offset = the “break”) -->
  <path fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        d="M28 40 L29 53 L27 67 L29 76"/>
  <path fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        d="M36 40 L35 52 L37 66 L34 76"/>
</svg>
