<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Over Easy Technologies — Product Catalog</title>
    <meta
      name="description"
      content="Over Easy Technologies product catalog — self-defense, medical, and lifestyle hardware."
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="oe-header">
      <div class="oe-header__top">
        <div class="oe-header__inner">
          <a class="oe-brand" href="#" id="oe-brand-link">
            <span class="oe-brand__text" id="oe-brand-name"></span>
          </a>
          <p class="oe-header__tagline" id="oe-hero-tagline"></p>
        </div>
      </div>
      <div class="oe-header__nav-wrap">
        <nav class="oe-tabs" id="oe-tabs" aria-label="Product categories">
          <div class="oe-tabs__inner" id="oe-tabs-inner"></div>
          <span
            class="oe-tabs__indicator"
            id="oe-tabs-indicator"
            aria-hidden="true"
          ></span>
        </nav>
      </div>
    </header>

    <main class="oe-main">
      <h2 class="oe-section-title" id="oe-section-title">Current lineup</h2>
      <div class="oe-grid" id="oe-product-grid"></div>
    </main>

    <footer class="oe-footer">
      <img id="oe-footer-logo" alt="" width="120" height="40" />
      <p id="oe-footer-note"></p>
    </footer>

    <div id="scene-lightbox" class="scene-lightbox" aria-hidden="true">
      <div
        class="scene-lightbox-panel"
        id="scene-lightbox-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Enlarged product image"
      >
        <button
          type="button"
          class="scene-lightbox-close"
          id="scene-lightbox-close"
          aria-label="Close"
        >
          ×
        </button>
        <div class="scene-lightbox-stage">
          <button
            type="button"
            class="scene-lightbox-nav scene-lightbox-nav--prev"
            id="scene-lightbox-prev"
            aria-label="Previous image"
            hidden
          >
            ‹
          </button>
          <div class="scene-lightbox-img-wrap">
            <img
              id="scene-lightbox-img"
              class="scene-lightbox-img"
              alt=""
              decoding="async"
            />
          </div>
          <button
            type="button"
            class="scene-lightbox-nav scene-lightbox-nav--next"
            id="scene-lightbox-next"
            aria-label="Next image"
            hidden
          >
            ›
          </button>
        </div>
        <p
          id="scene-lightbox-caption"
          class="scene-lightbox-caption"
          hidden
        ></p>
      </div>
    </div>

    <script src="products.js"></script>
    <script src="lightbox.js"></script>
    <script>
      (function () {
        const catalog = window.OVER_EASY_CATALOG;
        if (!catalog) return;

        const { brand, categories, products } = catalog;
        let activeCategory = categories[0]?.id ?? "";

        // Brand header
        document.getElementById("oe-brand-name").innerHTML = brand.name.replace(
          "Easy",
          "<span>Easy</span>",
        );
        document.getElementById("oe-hero-tagline").textContent = brand.tagline;
        document.getElementById("oe-footer-logo").src = brand.logo;
        document.getElementById("oe-footer-logo").alt = brand.name;
        document.getElementById("oe-footer-note").textContent =
          brand.footerNote;

        const tabsEl = document.getElementById("oe-tabs");
        const tabsInner = document.getElementById("oe-tabs-inner");
        const tabsIndicator = document.getElementById("oe-tabs-indicator");
        const grid = document.getElementById("oe-product-grid");
        const sectionTitle = document.getElementById("oe-section-title");

        tabsInner.innerHTML = categories
          .map(function (cat) {
            return (
              '<button type="button" class="oe-tab" data-category="' +
              escapeHtml(cat.id) +
              '" aria-selected="false">' +
              '<span class="oe-tab__label">' +
              escapeHtml(cat.label) +
              "</span>" +
              "</button>"
            );
          })
          .join("");

        function updateTabIndicator() {
          const activeBtn = tabsInner.querySelector(".oe-tab--active");
          if (!activeBtn || !tabsIndicator) return;
          const left =
            activeBtn.offsetLeft + tabsInner.offsetLeft - tabsEl.scrollLeft;
          tabsIndicator.style.width = activeBtn.offsetWidth + "px";
          tabsIndicator.style.transform = "translateX(" + left + "px)";
        }

        function renderProducts() {
          const visible = products.filter(function (p) {
            return p.category === activeCategory;
          });
          const catLabel =
            categories.find(function (c) {
              return c.id === activeCategory;
            })?.label ?? "Current lineup";

          sectionTitle.textContent = catLabel;

          grid.innerHTML = visible
            .map(function (p) {
              return renderCard(p);
            })
            .join("");

          tabsInner.querySelectorAll(".oe-tab").forEach(function (btn) {
            const selected = btn.dataset.category === activeCategory;
            btn.classList.toggle("oe-tab--active", selected);
            btn.setAttribute("aria-selected", selected ? "true" : "false");
          });
          requestAnimationFrame(updateTabIndicator);
        }

        function renderSizeOptions(p) {
          if (!p.sizeOptions?.length) return "";

          const fields = p.sizeOptions
            .map(function (field) {
              const selectId =
                "size-" + escapeHtml(p.id) + "-" + escapeHtml(field.id);
              const options = field.options
                .map(function (opt) {
                  const label = opt.soldOut
                    ? opt.label + " — sold out"
                    : opt.label;
                  const disabled = opt.soldOut ? " disabled" : "";
                  const className = opt.soldOut
                    ? ' class="oe-size-option--sold-out"'
                    : "";
                  return (
                    '<option value="' +
                    escapeHtml(opt.value) +
                    '"' +
                    disabled +
                    className +
                    ">" +
                    escapeHtml(label) +
                    "</option>"
                  );
                })
                .join("");

              return (
                '<div class="oe-size-field">' +
                '<label class="oe-size-label" for="' +
                selectId +
                '">' +
                escapeHtml(field.label) +
                "</label>" +
                '<select class="oe-size-select" id="' +
                selectId +
                '" name="' +
                escapeHtml(p.id + "-" + field.id) +
                '" aria-label="' +
                escapeHtml(field.label) +
                '">' +
                options +
                "</select>" +
                "</div>"
              );
            })
            .join("");

          return '<div class="oe-card__sizes">' + fields + "</div>";
        }

        function renderPurchaseButton() {
          const url = brand.purchaseUrl;
          if (!url) return "";
          return (
            '<div class="oe-card__actions">' +
            '<a class="oe-purchase-btn" href="' +
            escapeHtml(url) +
            '" target="_blank" rel="noopener noreferrer">Purchase</a>' +
            "</div>"
          );
        }

        function productImages(p) {
          if (p.images?.length) return p.images;
          if (p.image) return [{ path: p.image }];
          return [];
        }

        function renderCardMedia(p) {
          const imgs = productImages(p);
          const thumb = imgs[0]?.path || p.image || "";
          if (!thumb) return '<div class="oe-card__media"></div>';

          if (imgs.length <= 1) {
            return (
              '<div class="oe-card__media">' +
              '<img src="' +
              escapeHtml(thumb) +
              '" alt="' +
              escapeHtml(p.name) +
              '" loading="lazy" />' +
              "</div>"
            );
          }

          const payload = escapeHtml(
            JSON.stringify(
              imgs.map(function (img) {
                return { path: img.path, caption: img.caption || "" };
              }),
            ),
          );

          return (
            '<figure class="oe-card__media oe-card__media--zoomable" tabindex="0" ' +
            'role="button" aria-label="View ' +
            escapeHtml(p.name) +
            ' images" data-product-name="' +
            escapeHtml(p.name) +
            '" data-product-images="' +
            payload +
            '" data-image-index="0">' +
            '<img src="' +
            escapeHtml(thumb) +
            '" alt="' +
            escapeHtml(p.name) +
            '" loading="lazy" />' +
            '<span class="oe-card__media-count" aria-hidden="true">' +
            imgs.length +
            " photos</span>" +
            "</figure>"
          );
        }

        function renderCard(p) {
          const features = (p.features || [])
            .map(function (f) {
              return "<li>" + escapeHtml(f) + "</li>";
            })
            .join("");

          const footerParts = [];
          if (features) {
            footerParts.push(
              '<ul class="oe-card__features">' + features + "</ul>",
            );
          }
          const sizes = renderSizeOptions(p);
          if (sizes) footerParts.push(sizes);
          footerParts.push(renderPurchaseButton());

          return (
            '<article class="oe-card" id="product-' +
            escapeHtml(p.id) +
            '">' +
            renderCardMedia(p) +
            '<div class="oe-card__body">' +
            '<div class="oe-card__meta">' +
            (p.badge
              ? '<span class="oe-badge">' + escapeHtml(p.badge) + "</span>"
              : "") +
            (p.model
              ? '<span class="oe-model">' + escapeHtml(p.model) + "</span>"
              : "") +
            "</div>" +
            '<h3 class="oe-card__title">' +
            escapeHtml(p.name) +
            "</h3>" +
            (p.tagline
              ? '<p class="oe-card__tagline">' + escapeHtml(p.tagline) + "</p>"
              : "") +
            '<p class="oe-card__desc">' +
            escapeHtml(p.description) +
            "</p>" +
            '<div class="oe-card__footer">' +
            footerParts.join("") +
            "</div>" +
            "</div>" +
            "</article>"
          );
        }

        function setCategory(categoryId, options) {
          if (
            !categories.some(function (c) {
              return c.id === categoryId;
            })
          ) {
            return;
          }
          activeCategory = categoryId;
          renderProducts();
          if (!options || !options.skipHash) {
            history.replaceState(null, "", "#category-" + categoryId);
          }
          const activeBtn = tabsInner.querySelector(
            '.oe-tab[data-category="' + categoryId + '"]',
          );
          if (activeBtn) {
            activeBtn.scrollIntoView({
              behavior: "smooth",
              block: "nearest",
              inline: "center",
            });
          }
        }

        function resolveHash() {
          const hash = location.hash.replace(/^#/, "");
          if (!hash) {
            setCategory(categories[0].id, { skipHash: true });
            return;
          }
          if (hash.indexOf("category-") === 0) {
            setCategory(hash.slice("category-".length), { skipHash: true });
            return;
          }
          if (hash.indexOf("product-") === 0) {
            const productId = hash.slice("product-".length);
            const product = products.find(function (p) {
              return p.id === productId;
            });
            if (product?.category) {
              setCategory(product.category, { skipHash: true });
              requestAnimationFrame(function () {
                const el = document.getElementById("product-" + productId);
                if (el)
                  el.scrollIntoView({ behavior: "smooth", block: "start" });
              });
              return;
            }
          }
          setCategory(categories[0].id, { skipHash: true });
        }

        tabsEl.addEventListener("click", function (event) {
          const btn = event.target.closest(".oe-tab");
          if (!btn) return;
          setCategory(btn.dataset.category);
        });

        tabsEl.addEventListener("scroll", updateTabIndicator, {
          passive: true,
        });

        window.addEventListener("hashchange", resolveHash);
        window.addEventListener("resize", updateTabIndicator);
        resolveHash();

        if (window.OE_INIT_PRODUCT_LIGHTBOX) {
          window.OE_INIT_PRODUCT_LIGHTBOX();
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
      })();
    </script>
  </body>
</html>
